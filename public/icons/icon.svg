    </linearGradient>
    <radialGradient id="petal" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f0607a"/><stop offset="0.6" stop-color="#c8183c"/><stop offset="1" stop-color="#8e0c27"/>
