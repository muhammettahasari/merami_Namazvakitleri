  <path d="M184 214 C 204 232, 232 238, 256 236 C 280 238, 308 232, 328 214 C 332 262, 300 300, 256 302 C 212 300, 180 262, 184 214 Z" fill="url(#petal)"/>
  <path d="M184 214 C 204 232, 232 238, 256 236 C 280 238, 308 232, 328 214 C 306 226, 282 230, 256 229 C 230 230, 206 226, 184 214 Z" fill="#ff8aa0" opacity=".55"/>
