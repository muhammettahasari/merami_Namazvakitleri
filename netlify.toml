[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/diyanet"
  to = "/.netlify/functions/diyanet"
  status = 200

[[redirects]]
  from = "/api/fazilet"
  to = "/.netlify/functions/fazilet"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
