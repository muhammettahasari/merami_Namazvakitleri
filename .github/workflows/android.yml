name: Android APK

# GitHub'a her dosya yüklendiğinde Android uygulamasını (APK) derler ve
# "Releases" sayfasına Vakitler.apk olarak koyar.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub'ın Ubuntu sunucusunda Android SDK hazır kurulu gelir
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Uyumluluk kontrolü (Android 8.0 ve sonrası)
        working-directory: android
        run: gradle lintRelease --no-daemon

      - name: APK derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk Vakitler.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vakitler-apk
          path: Vakitler.apk

      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vakitler 1.0.${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **Vakitler.apk** dosyasını indirip açın.
            Daha önce kurduysanız üzerine güncelleme olarak kurulur.
          files: Vakitler.apk
          make_latest: true
